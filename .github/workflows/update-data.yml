name: Update data

# 평일 아침 07:00 KST(= 전날 22:00 UTC, 일~목)에 항목별 DB를 업데이트해 data 브랜치에 덮어쓴다.
# 코드는 main, DB는 data 브랜치 (publish_data.sh). 대시보드(macro-dashboard)는 data 브랜치의 .db.gz 를 읽는다.
# 필요한 secret: FRED_API_KEY (리포 Settings > Secrets and variables > Actions)
on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Restore DBs from data branch
        run: |
          if git fetch -q --depth 1 origin data; then
            git checkout FETCH_HEAD -- output/db
            git reset -q
            for f in output/db/*.db.gz; do gunzip -kf "$f"; done   # data 브랜치엔 압축본만 있어 풀어서 .db 로
          else
            echo "data 브랜치가 아직 없어요. 처음부터 만들어요."
          fi
          ls -la output/db || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests openpyxl

      # 한 DB가 실패해도 나머지는 올리고, 마지막에 실패로 표시
      - name: FRED - Manufacturing
        id: mfg
        continue-on-error: true
        run: python build_db.py --ids us_macro_PBA_manufacturing

      - name: FRED - Financial Indicators
        id: fin
        continue-on-error: true
        run: python build_db.py --ids us_macro_MBF_financial_indicator

      - name: FRED - H.8 Commercial Banks
        id: banks
        continue-on-error: true
        run: python build_db.py --ids us_macro_banks

      - name: FRED - NIPA GDP/GNP
        id: gdp
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_GDP_GNP

      - name: FRED - NIPA Personal Income & Outlays
        id: gdp_pio
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_Personal_Income_Outlays

      - name: FRED - NIPA Domestic Capital Account
        id: gdp_dca
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_Domestic_Capital_Account

      - name: FRED - NIPA Exports
        id: gdp_exp
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_Foreign_Transactions_Exports

      - name: FRED - NIPA Imports
        id: gdp_imp
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_Foreign_Transactions_Imports

      - name: FRED - NIPA Gov't Receipts & Expenditures
        id: gdp_gov
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_Govt_Receipts_Expenditures

      - name: FRED - NIPA Price Indexes & Deflators
        id: gdp_price
        continue-on-error: true
        run: python build_db.py --ids us_macro_NIPA_Price_Indexes_Deflators

      - name: NY Fed - Household Debt and Credit
        id: hhdc
        continue-on-error: true
        run: python nyfed_hhdc.py

      - name: Publish to data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash publish_data.sh

      - name: Fail if any update failed
        if: steps.mfg.outcome == 'failure' || steps.fin.outcome == 'failure' || steps.banks.outcome == 'failure' || steps.gdp.outcome == 'failure' || steps.gdp_pio.outcome == 'failure' || steps.gdp_dca.outcome == 'failure' || steps.gdp_exp.outcome == 'failure' || steps.gdp_imp.outcome == 'failure' || steps.gdp_gov.outcome == 'failure' || steps.gdp_price.outcome == 'failure' || steps.hhdc.outcome == 'failure'
        run: |
          echo "mfg=${{ steps.mfg.outcome }} fin=${{ steps.fin.outcome }} banks=${{ steps.banks.outcome }} gdp=${{ steps.gdp.outcome }} gdp_pio=${{ steps.gdp_pio.outcome }} gdp_dca=${{ steps.gdp_dca.outcome }} gdp_exp=${{ steps.gdp_exp.outcome }} gdp_imp=${{ steps.gdp_imp.outcome }} gdp_gov=${{ steps.gdp_gov.outcome }} gdp_price=${{ steps.gdp_price.outcome }} hhdc=${{ steps.hhdc.outcome }}"
          exit 1
